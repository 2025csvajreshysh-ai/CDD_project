<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – AI Foodie</title>
  <link rel="icon" href="/static/assets/aifoodie-mark.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261118-visual-refresh">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img class="brand-logo" src="/static/assets/aifoodie-mark.svg" alt="" aria-hidden="true">
        <span class="brand-font fs-4 text-dark">AI <span class="brand-orange">Foodie</span></span>
      </a>
      <a href="/" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Home</a>
    </div>
  </nav>

  <div class="container py-5 my-auto">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">

        <!-- 1-Click Demo Login Panel (Highlight for College Expo Presentation) -->
        <div class="card border-0 shadow-lg rounded-4 p-4 mb-4 bg-white border-top border-4 border-warning">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="d-flex align-items-center gap-2">
              <span class="fs-4">🚀</span>
              <div>
                <h5 class="fw-bold mb-0">One-Click Demonstration Login</h5>
                <span class="small text-muted">Instantly authenticate as any of the 5 roles</span>
              </div>
            </div>
          </div>

          <div class="alert alert-light border small text-muted mb-3 py-2">
            <i class="bi bi-info-circle me-1 text-primary"></i> All demo accounts share password: <code>Demo@12345</code> (Pre-seeded in MySQL database)
          </div>

          <div class="d-flex flex-column gap-2">
            <button class="btn btn-outline-dark text-start p-3 rounded-3 d-flex align-items-center justify-content-between" onclick="Auth.executeDemoLogin('customer')">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-circle fs-5"><i class="bi bi-person-fill"></i></div>
                <div>
                  <div class="fw-bold">Login as Customer</div>
                  <div class="small text-muted">customer@demo.com (Aarav Sharma)</div>
                </div>
              </div>
              <i class="bi bi-arrow-right brand-orange"></i>
            </button>

            <button class="btn btn-outline-dark text-start p-3 rounded-3 d-flex align-items-center justify-content-between" onclick="Auth.executeDemoLogin('restaurant_admin')">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-warning bg-opacity-10 text-warning p-2 rounded-circle fs-5"><i class="bi bi-shop"></i></div>
                <div>
                  <div class="fw-bold">Login as Restaurant Admin</div>
                  <div class="small text-muted">admin@demo.com (Spice Garden Manager)</div>
                </div>
              </div>
              <i class="bi bi-arrow-right brand-orange"></i>
            </button>

            <button class="btn btn-outline-dark text-start p-3 rounded-3 d-flex align-items-center justify-content-between" onclick="Auth.executeDemoLogin('kitchen_staff')">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-danger bg-opacity-10 text-danger p-2 rounded-circle fs-5"><i class="bi bi-fire"></i></div>
                <div>
                  <div class="fw-bold">Login as Kitchen Staff</div>
                  <div class="small text-muted">kitchen@demo.com (Kitchen Display System)</div>
                </div>
              </div>
              <i class="bi bi-arrow-right brand-orange"></i>
            </button>

            <button class="btn btn-outline-dark text-start p-3 rounded-3 d-flex align-items-center justify-content-between" onclick="Auth.executeDemoLogin('delivery_partner')">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-info bg-opacity-10 text-info p-2 rounded-circle fs-5"><i class="bi bi-bicycle"></i></div>
                <div>
                  <div class="fw-bold">Login as Delivery Partner</div>
                  <div class="small text-muted">delivery@demo.com (Vikram Singh)</div>
                </div>
              </div>
              <i class="bi bi-arrow-right brand-orange"></i>
            </button>

            <button class="btn btn-outline-dark text-start p-3 rounded-3 d-flex align-items-center justify-content-between" onclick="Auth.executeDemoLogin('super_admin')">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-success bg-opacity-10 text-success p-2 rounded-circle fs-5"><i class="bi bi-shield-check"></i></div>
                <div>
                  <div class="fw-bold">Login as Super Admin</div>
                  <div class="small text-muted">superadmin@demo.com (Platform Admin)</div>
                </div>
              </div>
              <i class="bi bi-arrow-right brand-orange"></i>
            </button>
          </div>
        </div>

        <!-- Standard Credentials Login -->
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <h5 class="fw-bold mb-3">Or Login With Credentials</h5>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Email Address</label>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Password</label>
              <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary-orange w-100 py-2 fw-bold">Sign In</button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Don't have an account? <a href="/pages/register.html" class="brand-orange fw-bold text-decoration-none">Create Customer Account</a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;
      await Auth.executeLogin(email, pass);
    });
  </script>
</body>
</html>
