<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – AI Foodie</title>
  <link rel="icon" href="/static/assets/aifoodie-mark.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261118-visual-refresh">
</head>
<body class="bg-light">

  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img class="brand-logo" src="/static/assets/aifoodie-mark.svg" alt="" aria-hidden="true">
        <span class="brand-font fs-4 text-dark">AI <span class="brand-orange">Foodie</span></span>
      </a>
      <a href="/pages/login.html" class="btn btn-outline-dark btn-sm">Sign In</a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
          <div class="text-center mb-4">
            <span class="badge badge-orange mb-2">JOIN AI FOODIE</span>
            <h4 class="fw-bold">Create Your Account</h4>
            <p class="text-muted small">Unlock AI recommendations, 100 bonus loyalty points, and fast ordering</p>
          </div>

          <form id="registerForm">
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Full Name</label>
              <input type="text" id="regName" class="form-control" placeholder="Aarav Sharma" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Email Address</label>
              <input type="email" id="regEmail" class="form-control" placeholder="aarav@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Phone Number</label>
              <input type="tel" id="regPhone" class="form-control" placeholder="+91 98450 12345" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-muted">Password</label>
              <input type="password" id="regPassword" class="form-control" placeholder="Create a strong password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary-orange w-100 py-2 fw-bold mt-2">Create Account</button>
          </form>

          <div class="text-center mt-3 small text-muted">
            Already registered? <a href="/pages/login.html" class="brand-orange fw-bold text-decoration-none">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById("regName").value.trim(),
        email: document.getElementById("regEmail").value.trim(),
        phone: document.getElementById("regPhone").value.trim(),
        password: document.getElementById("regPassword").value
      };

      try {
        Auth.showToast("Creating account...", "info");
        const resp = await API.register(payload);
        API.setToken(resp.access_token);
        API.setUser({
          id: resp.user_id,
          email: resp.email,
          full_name: resp.full_name,
          role: resp.role
        });
        Auth.showToast("Account created successfully! Welcome to AI Foodie.", "success");
        setTimeout(() => {
          window.location.href = "/pages/customer-dashboard.html";
        }, 800);
      } catch (err) {
        Auth.showToast(err.message, "danger");
      }
    });
  </script>
</body>
</html>
